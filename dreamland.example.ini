[model_api_keys]
# Provider API keys are read from OPENAI_API_KEY, XAI_API_KEY, and
# ANTHROPIC_API_KEY. Do not store LLM provider secrets in this ini file.
# Representative current Anthropic model choices are
# anthropic:claude-haiku-4-5-20251001 for speed and cost,
# anthropic:claude-sonnet-5 for balanced work, anthropic:claude-opus-5 for
# complex high-capability work, and anthropic:claude-fable-5 when maximum
# generally available capability outweighs cost and latency.

[langfuse]
# Enable Langfuse tracing for LangGraph agent calls.
enabled = false
public_key = replace-me
secret_key = replace-me
# For Langfuse Cloud, leave unset or use your region-specific host.
host =

[agent]
# Model format is provider:model. Supported providers: anthropic, openai, xai.
model = openai:gpt-6.1-sol
# Optional model controls. Leave blank to use the provider default.
# reasoning_summary and verbosity are OpenAI-only controls ignored by xai
# and anthropic.
# reasoning_effort is supported by OpenAI, xAI reasoning models, and Claude
# models that support Anthropic effort controls. For Claude, this also requests
# summarized thinking capture. xhigh and max map to Claude max; xAI ignores max.
# Supported reasoning effort values: none, low, medium, high, xhigh, max.
reasoning_effort = low
# Supported reasoning summary values: auto, concise, detailed.
reasoning_summary = detailed
# Supported verbosity values: low, medium, high.
verbosity =
# OpenAI-only evaluation controls; other providers log and ignore these.
# API: responses or chat_completions. Blank preserves existing selection;
# Astra defaults to Responses. Chat Completions needs blank summary and mode.
openai_api =
# Tier: auto, default (Standard), flex, fast, priority. Blank inherits project.
openai_service_tier = fast
# Mode: standard or pro for GPT-5.6/Astra; independent of reasoning effort.
openai_reasoning_mode =
# Anthropic-only fast mode. Blank uses provider default.
# Supported speed values: fast.
speed =
# Anthropic-only prompt-cache control; automatic uses 5-minute ephemeral hints.
# OpenAI GPT-5.6 / GPT-6 Astra commands apply DREAMLAND's explicit cache boundary
# automatically, independent of this setting. xAI uses its provider default.
# Supported prompt cache values: automatic, off.
prompt_cache =
# Maximum tokens generated by one model call. Blank or 0 disables the safeguard.
max_output_tokens = 12800
# Prompt files are loaded from src/dreamland/prompts.
system_prompt = system.md

[spiritguide]
# Operator-facing state guidance uses separate model controls from emulation.
# Model format is provider:model. Supported providers: anthropic, openai, xai.
# Current project preference for Spiritguide is OpenAI GPT-6 Astra with high
# reasoning effort. Anthropic/Claude is not recommended for Spiritguide broad
# world-state changes; DREAMLAND emits a warning if configured here.
model = openai:gpt-6-astra
# Optional model controls. Leave blank to use the provider default.
# reasoning_summary and verbosity are OpenAI-only controls ignored by xai
# and anthropic.
# reasoning_effort is supported by OpenAI, xAI reasoning models, and Claude
# models that support Anthropic effort controls. For Claude, this also requests
# summarized thinking capture. xhigh and max map to Claude max; xAI ignores max.
# Supported reasoning effort values: none, low, medium, high, xhigh, max.
reasoning_effort = high
# Supported reasoning summary values: auto, concise, detailed.
reasoning_summary = detailed
# Supported verbosity values: low, medium, high.
verbosity =
# OpenAI-only evaluation controls; other providers log and ignore these.
# API: responses or chat_completions. Blank preserves existing selection;
# Astra defaults to Responses. Chat Completions needs blank summary and mode.
openai_api =
# Tier: auto, default (Standard), flex, fast, priority, ultrafast. Blank inherits project.
openai_service_tier = ultrafast
# Mode: standard or pro for GPT-5.6/Astra; independent of reasoning effort.
openai_reasoning_mode =
# Anthropic-only fast mode. Blank uses provider default.
# Supported speed values: fast.
speed =
# Anthropic-only prompt-cache control; automatic uses 5-minute ephemeral hints.
# The OpenAI command-emulator cache optimization does not apply to
# Spiritguide, which continues to receive its full context without that marker.
# xAI uses its provider default. Supported values: automatic, off.
prompt_cache =
# Maximum tokens generated by one spiritguide model call.
max_output_tokens = 16384
# Prompt files are loaded from src/dreamland/prompts.
system_prompt = spiritguide.md

[enrichment]
# Session-local, just-in-time world enrichment is enabled by default. Manual
# invocations are always available and are not listed here.
enabled = true
# safe permits only validated additive enrichment patches; shadow runs and
# traces the graph without changing session state.
apply_mode = safe
# Supported automatic triggers include focused read-ahead and ambient-presence
# work. See docs/ENRICHMENT_AGENT.md for deterministic admission semantics.
triggers = host_discovered,active_host_changed,host_presence_bootstrap,presence_probe,subject_first_touch,state_materialized,materialization_followthrough,surface_focus,interaction_pulse,session_idle
# Trigger timing and per-session work limits. Zero disables the corresponding
# delay or cooldown; rate and in-flight limits must be greater than zero.
idle_delay_ms = 5000
cooldown_ms = 30000
max_jobs_per_minute = 6
max_inflight_per_session = 3
# Retained enrichment telemetry is independently bounded per session.
event_log_capacity = 10000

[enrichment.coordinator]
# Each graph role has independent standard model controls so latency and quality
# can be tuned without changing the other roles.
model = openai:gpt-6-luna
reasoning_effort = low
reasoning_summary =
verbosity = low
# Same OpenAI-only controls as [agent]; blank preserves provider defaults.
openai_api =
openai_service_tier = fast
openai_reasoning_mode =
speed =
prompt_cache =
max_output_tokens = 2048
system_prompt = enrichment_coordinator.md

[enrichment.ambient_coordinator]
# Ambient planning is independently configurable while sharing the same safe
# Expert, Integrator, and application path as focused enrichment.
model = openai:gpt-6-luna
reasoning_effort = low
reasoning_summary =
verbosity = low
# Same OpenAI-only controls as [agent]; blank preserves provider defaults.
openai_api =
openai_service_tier = fast
openai_reasoning_mode =
speed =
prompt_cache =
max_output_tokens = 2048
system_prompt = enrichment_ambient_coordinator.md

[enrichment.expert]
# Experts return compact domain reports rather than DREAMLAND state patches.
model = openai:gpt-6.1-sol
reasoning_effort = low
reasoning_summary =
verbosity = low
# Same OpenAI-only controls as [agent]; blank preserves provider defaults.
openai_api =
openai_service_tier = fast
openai_reasoning_mode =
speed =
prompt_cache =
max_output_tokens = 2048
system_prompt = enrichment_expert.md

[enrichment.integrator]
# The integrator converts expert findings into a bounded enrichment proposal.
model = openai:gpt-6-luna
reasoning_effort = low
reasoning_summary =
verbosity = low
# Same OpenAI-only controls as [agent]; blank preserves provider defaults.
openai_api =
openai_service_tier = fast
openai_reasoning_mode =
speed =
prompt_cache =
max_output_tokens = 4096
system_prompt = enrichment_integrator.md

[logging]
# Console logging can be disabled entirely or filtered by event type.
enabled = true
level = INFO
events = lifecycle,commands,replies,tokens,console,failures,enrichment
# Reply logs include only the first rendered line, truncated to this length.
reply_excerpt_chars = 160

[console]
# Maximum number of filtered log records retained for the logging command.
log_capacity = 1000

[api]
# Optional local admin API. The initial server exposes read-only health, status,
# logs, sessions, traces, state profiles, commands, and state deltas.
enabled = false
host = 127.0.0.1
port = 8765
# Optional when enabled. If blank or set to replace-me, DREAMLAND generates a
# temporary token and prints it on boot. For a stable token:
# python3 -c "import secrets; print(secrets.token_urlsafe(32))"
token = replace-me
# MCP write tools are model-invokable and require deliberate opt-in.
mcp_write_tools = false

[product_api]
# Private product integration is a separate, opt-in service. Phase 0 fails
# closed if this switch is enabled because no product runtime is composed yet.
enabled = false

[state_profile]
# Required saved state profile name. The packaged `default` profile provides a
# neutral boot state; local profiles live in state_profiles/.
profile = default

[ssh]
host = 127.0.0.1
port = 2222
# direct preserves the existing shell/exec experience. lobby requires a PTY
# shell and offers deterministic agreement and curated fresh world visits.
entry_mode = direct
# DREAMLAND creates and reuses a dedicated host key under the service user's
# XDG state directory by default. Service/container deployments should set an
# absolute durable path, for example:
# host_key_path = /var/lib/dreamland/ssh_host_rsa_key
# SSH password authentication is mandatory. Set DREAMLAND_SSH_PASSWORD in the
# process environment; passwords in this file are deliberately ignored.
# Optional lobby demo logins dreamland_fast and dreamland_fast_simple use
# DREAMLAND_SSH_FAST_PASSWORD (a different password) and emulator tier ultrafast.
# Normal logins use the configured [agent] tier above (fast by default).

[lobby]
# INI-relative paths use the active config file directory. Every setting accepts
# DREAMLAND_LOBBY_<UPPERCASE_NAME>; environment path overrides must be absolute.
# Catalog controls create/persist this file; an empty catalog publishes no worlds.
catalog_path = lobby/catalog.json
public_registry_path = lobby/public_visits.sqlite3
# Omit text paths to use the packaged UTF-8 plain-text copy. Customized files
# replace that copy for new connections; invalid content fails closed.
# welcome_path = lobby/welcome.txt
# guidelines_path = lobby/guidelines.txt
# contact_path = lobby/contact.txt
# Idle timeout: 1..86400 seconds, input: 16..4096 bytes, retries: 1..1000.
idle_timeout_seconds = 300
max_input_bytes = 256
max_invalid_attempts = 20
# Public reference mapping retention: 1..3650 days; excludes transcript bodies.
retention_days = 30
# auto uses compatible client terminal capabilities; off disables each effect.
# Color and visible-screen clearing can be disabled independently.
color = auto
clear_screen = auto
# auto uses the large welcome banner only when it fits; simple forces the wordmark.
banner = auto
# The approved intro defaults to auto; off shows the static welcome immediately.
# auto enables a centered two-second reveal on compatible PTYs with room for art.
# Requires clear_screen=auto; clears before/after. color=off uses monochrome art.
intro_animation = auto
